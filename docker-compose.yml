version: "3.8"

services:
  telegram-bot:
    build: .
    container_name: dwas-telegram-bot
    command: python bot.py
    restart: unless-stopped
    env_file:
      - .env

  whatsapp-webhook:
    build: .
    container_name: dwas-whatsapp-service
    command: uvicorn whatsapp_webhook:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
